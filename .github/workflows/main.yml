name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ns7173.stampdutycalculator',
            appName: 'CG Stamp & Registration Calculator',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CG-Stamp-Registration-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
