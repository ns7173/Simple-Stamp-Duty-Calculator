name: Build Windows Installation EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installation Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        shell: pwsh
        run: |
          npm run build

      - name: Verify Electron Main Script
        shell: pwsh
        run: |
          if (!(Test-Path electron.js)) {
            Write-Host "Creating electron.js fallback..."
            @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 850,
              minWidth: 800,
              minHeight: 600,
              title: 'Stamp Duty and Registration Fees Calculator',
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
              },
            });

            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Out-File -FilePath electron.js -Encoding utf8
          }

      - name: Build Windows Installation EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: |
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stamp-duty-calculator-windows-installation-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
