name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Create Electron main process
        shell: pwsh
        run: |
          $electronMain = @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          const isDev = !app.isPackaged;

          let mainWindow;

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1200,
              height: 800,
              webPreferences: {
                preload: path.join(__dirname, 'preload.js')
              }
            });

            const startUrl = isDev
              ? 'http://localhost:3000'
              : `file://${path.join(__dirname, '../dist/index.html')}`;

            mainWindow.loadURL(startUrl);

            if (isDev) {
              mainWindow.webContents.openDevTools();
            }

            mainWindow.on('closed', () => {
              mainWindow = null;
            });
          }

          app.on('ready', createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });

          app.on('activate', () => {
            if (mainWindow === null) {
              createWindow();
            }
          });
          '@

          New-Item -ItemType Directory -Path ".\public" -Force | Out-Null
          Set-Content -Path ".\public\electron.js" -Value $electronMain -Encoding UTF8

      - name: Update package.json with Electron config
        shell: pwsh
        run: |
          $packageJson = Get-Content 'package.json' -Raw | ConvertFrom-Json

          $packageJson | Add-Member -NotePropertyName 'description' -NotePropertyValue 'Simple Stamp Duty Calculator' -Force
          $packageJson | Add-Member -NotePropertyName 'author' -NotePropertyValue 'Your Name' -Force
          $packageJson | Add-Member -NotePropertyName 'homepage' -NotePropertyValue './' -Force
          $packageJson | Add-Member -NotePropertyName 'main' -NotePropertyValue 'public/electron.js' -Force

          $packageJson | ConvertTo-Json -Depth 10 | Set-Content 'package.json' -Encoding UTF8

      - name: Build EXE with electron-builder
        run: npx electron-builder --win --publish never
