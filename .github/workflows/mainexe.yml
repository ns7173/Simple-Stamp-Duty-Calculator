name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron and builder
        run: npm install --legacy-peer-deps electron electron-builder

      - name: Build web application
        run: npm run build

      - name: Create Electron main process
        run: |
          $electronMain = @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const isDev = require('electron-is-dev');

          let mainWindow;

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1200,
              height: 800,
              webPreferences: {
                preload: path.join(__dirname, 'preload.js')
              }
            });

            const startUrl = isDev
              ? 'http://localhost:3000'
              : `file://$${path.join(__dirname, '../build/index.html')}`;

            mainWindow.loadURL(startUrl);

            if (isDev) {
              mainWindow.webContents.openDevTools();
            }

            mainWindow.on('closed', () => {
              mainWindow = null;
            });
          }

          app.on('ready', createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });

          app.on('activate', () => {
            if (mainWindow === null) {
              createWindow();
            }
          });
          "@

          New-Item -ItemType File -Path ".\public\electron.js" -Value $electronMain -Force

      - name: Update package.json with Electron config
        run: |
          $packageJson = Get-Content 'package.json' -Raw | ConvertFrom-Json
          
          $packageJson.homepage = './'
          $packageJson.main = 'public/electron.js'
          $packageJson.homepage = './'
          
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content 'package.json'

      - name: Build EXE with electron-builder
        run: |
          npx electron-builder --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CG-Stamp-Registration-Calculator-EXE
          path: dist/*.exe
          if-no-files-found: ignore

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Artifacts
          path: dist/
