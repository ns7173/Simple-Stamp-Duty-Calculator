name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Project Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --legacy-peer-deps
          } else {
            npm install --legacy-peer-deps
          }

      - name: Build Web Application
        run: npm run build

      - name: Install Electron Builder
        shell: pwsh
        run: |
          npm install --legacy-peer-deps -D electron electron-builder

      - name: Configure Electron Packaging
        shell: pwsh
        run: |
          node -e @"
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          pkg.main = 'electron.js';
          pkg.author = pkg.author || 'Stamp Duty Calculator';
          pkg.description = pkg.description || 'Property Valuation & Stamp Duty Calculator';

          pkg.build = {
            appId: 'com.stampduty.calculator',
            productName: 'Stamp Duty Calculator',
            directories: { output: 'release' },
            files: ['dist/**/*', 'electron.js'],
            win: { target: ['nsis', 'portable'] },
            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true
            }
          };

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "@

          if (!(Test-Path electron.js)) {
            @'
const { app, BrowserWindow } = require('electron');
const path = require('path');

function createWindow() {
  const win = new BrowserWindow({
    width: 1280,
    height: 850,
    minWidth: 800,
    minHeight: 600,
    title: 'Stamp Duty and Registration Fees Calculator',
    autoHideMenuBar: true,
    webPreferences: {
      nodeIntegration: false,
      contextIsolation: true,
    },
  });

  win.loadFile(path.join(__dirname, 'dist', 'index.html'));
}

app.whenReady().then(createWindow);

app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') app.quit();
});
'@ | Out-File -FilePath electron.js -Encoding utf8
          }

      - name: Build Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: |
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp-duty-calculator-windows-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
