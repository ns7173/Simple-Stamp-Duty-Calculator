<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for Android & Windows -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Stamp / Landmark Icon -->
  <g transform="translate(106, 96)" filter="url(#shadow)">
    <!-- Base Pedestal -->
    <rect x="20" y="270" width="260" height="24" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="10" y="294" width="280" height="26" rx="6" fill="#f8fafc" />
    <!-- Pillars -->
    <rect x="40" y="110" width="30" height="150" rx="6" fill="#ffffff" />
    <rect x="105" y="110" width="30" height="150" rx="6" fill="#ffffff" />
    <rect x="165" y="110" width="30" height="150" rx="6" fill="#ffffff" />
    <rect x="230" y="110" width="30" height="150" rx="6" fill="#ffffff" />
    <!-- Architrave / Top Bar -->
    <rect x="25" y="80" width="250" height="24" rx="4" fill="#ffffff" />
    <!-- Triangle Pediment -->
    <polygon points="150,10 15,80 285,80" fill="#ffffff" />
    <!-- Indian Rupee / Stamp Symbol Badge in Center -->
    <circle cx="150" cy="50" r="18" fill="#fbbf24" />
    <text x="150" y="56" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#1e1b4b" text-anchor="middle">₹</text>
  </g>
</svg>
